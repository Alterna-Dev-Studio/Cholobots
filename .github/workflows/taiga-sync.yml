# ABOUTME: Post-merge Taiga sync, run on the fork Alterna-Dev-Studio/Cholobots when its main (which follows upstream/main) is pushed.
# ABOUTME: Resolves each pushed commit to its merged upstream PR; Done/Closed and task closing stay opt-in via label or tag.
#
# The fork runs this because GitHub-hosted runners cannot reach Taiga
# (https://backlog.growthgarage.org); the homelab self-hosted runners can. The
# repository guard keeps MrsBohemian/Cholobots' copy of this file inert: a push
# there creates a skipped run. The fork's main advances through /merge-train
# (git push origin refs/remotes/upstream/main:refs/heads/main) or by hand.
#
# Requires repository secrets TAIGA_API_URL, TAIGA_USERNAME and TAIGA_PASSWORD on
# Alterna-Dev-Studio/Cholobots (the agent account). Taiga project 39 (cholo-bots).
#
# Security: the fork is public and the runners are self-hosted, so this workflow
# must never gain a trigger that a fork's PR can fire.
name: Taiga Sync

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: taiga-sync
  cancel-in-progress: false

jobs:
  update-taiga:
    if: github.repository == 'Alterna-Dev-Studio/Cholobots'
    runs-on: [self-hosted, Linux, X64, small]
    env:
      # Upstream PRs below #8 are never synced: PR #7 is #32's dump-only PR and #32
      # carries close-tasks-on-merge. Never re-run upstream's failed PR #7 sync run.
      TAIGA_SYNC_MIN_UPSTREAM_PR: 8
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        sparse-checkout: |
          scripts/taiga-update-on-merge.sh
          scripts/taiga_closing_refs.py
          scripts/taiga_sync_from_push.py
        sparse-checkout-cone-mode: false

    - name: Verify Taiga login
      env:
        TAIGA_API_URL: ${{ secrets.TAIGA_API_URL }}
        TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
        TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
      run: |
        AUTH_PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"type": "normal", "username": os.environ["TAIGA_USERNAME"], "password": os.environ["TAIGA_PASSWORD"]}))')
        CURL_STDERR=$(mktemp)
        trap 'rm -f "$CURL_STDERR"' EXIT
        set +e
        HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
          -X POST "${TAIGA_API_URL}/api/v1/auth" \
          -H "Content-Type: application/json" \
          -d @- <<<"$AUTH_PAYLOAD" 2>"$CURL_STDERR")
        CURL_EXIT_CODE=$?
        set -e
        if [ "$CURL_EXIT_CODE" -ne 0 ]; then
          # Name the exit code: a resolve/TLS/timeout failure means TAIGA_API_URL is
          # not an address this runner can use, a different fault from a rejected
          # credential.
          case "$CURL_EXIT_CODE" in
            6)  DIAGNOSIS="could not resolve host — TAIGA_API_URL names a host this runner has no DNS for" ;;
            7)  DIAGNOSIS="connection refused/unreachable — host resolves but nothing is listening on that port" ;;
            28) DIAGNOSIS="timed out — host is unreachable from this runner (firewall/routing)" ;;
            35|60) DIAGNOSIS="TLS failure — certificate not trusted by this runner, or wrong scheme" ;;
            *)  DIAGNOSIS="see the curl message below" ;;
          esac
          echo "::error::Taiga login request failed before receiving a valid HTTP response (curl exit $CURL_EXIT_CODE: $DIAGNOSIS). TAIGA_API_URL must be an origin reachable from this runner (https://backlog.growthgarage.org), with no trailing slash and no /api/v1 suffix."
          sed 's/^/  curl: /' "$CURL_STDERR"
          exit 1
        fi
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Taiga login failed (HTTP $HTTP_CODE). Check TAIGA_API_URL, TAIGA_USERNAME, and TAIGA_PASSWORD secrets."
          exit 1
        fi
        echo "Taiga login OK"

    - name: Sync merged upstream PRs
      env:
        TAIGA_API_URL: ${{ secrets.TAIGA_API_URL }}
        TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
        TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
        GITHUB_TOKEN: ${{ github.token }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
      run: |
        # Claims are parsed by scripts/taiga_closing_refs.py (a bare #ref mention
        # never closes anything); side effects run through
        # scripts/taiga-update-on-merge.sh --skip-if-synced, once per claimed ref.
        chmod +x scripts/taiga-update-on-merge.sh
        python3 scripts/taiga_sync_from_push.py
